<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View your Sky Bridge Business Solution AI services subscription and account details.">
  <title>My Account | Sky Bridge Business Solution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >
  <style>
    :root {
      --bg: #08111f;
      --panel: #0d1a2b;
      --panel-soft: #102138;
      --text: #d8e2ef;
      --heading: #eef6ff;
      --muted: #8ca0bb;
      --accent: #52e0c4;
      --accent-soft: rgba(82, 224, 196, 0.12);
      --line: rgba(140, 160, 187, 0.18);
      --warn: #f2c078;
      --warn-soft: rgba(242, 192, 120, 0.12);
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.32);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    p { margin: 0; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 24px 0;
      align-items: center;
      justify-content: space-between;
      background: rgba(8, 17, 31, 0.86);
      backdrop-filter: blur(18px);
    }
    .logo {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 900;
    }
    .nav-links { display: flex; align-items: center; gap: clamp(14px, 2.4vw, 28px); font-weight: 800; text-transform: lowercase; }
    .nav-links a:hover { color: var(--accent); }
    .nav-links button {
      background: none;
      border: none;
      font-family: inherit;
      font-weight: 800;
      text-transform: lowercase;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
    }
    .nav-links button:hover { color: var(--accent); }

    main { width: min(760px, calc(100% - 40px)); margin: 0 auto; padding: 56px 0 100px; }

    #loadingState { text-align: center; color: var(--muted); padding: 80px 0; }

    .account-intro .intro { color: var(--accent); font-weight: 800; text-transform: lowercase; letter-spacing: 0.02em; }
    .account-intro h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); color: var(--heading); margin: 12px 0 6px; font-weight: 900; }
    .account-intro p { color: var(--muted); font-size: 0.96rem; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 30px 28px;
      box-shadow: var(--shadow);
      margin-top: 32px;
    }
    .panel h2 { color: var(--heading); font-size: 1.1rem; margin: 0 0 18px; }

    .plan-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .plan-name { font-size: 1.4rem; font-weight: 900; color: var(--heading); }
    .plan-tagline { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }

    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .status-active { background: var(--accent-soft); color: var(--accent); }
    .status-pending, .status-inactive { background: var(--warn-soft); color: var(--warn); }

    .no-plan-cta { margin-top: 22px; display: flex; gap: 14px; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.9rem;
    }
    .btn-primary { background: var(--accent); color: var(--bg); }
    .btn-secondary { border: 1px solid var(--line); color: var(--heading); }

    .detail-list { list-style: none; margin: 0; padding: 0; }
    .detail-list li {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.92rem;
    }
    .detail-list li:last-child { border-bottom: none; }
    .detail-list span:first-child { color: var(--muted); }
    .detail-list span:last-child { color: var(--heading); font-weight: 600; }

    .site-footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 40px 0; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html" aria-label="Sky Bridge Business Solution home">SB</a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="index.html">home</a>
      <a href="pricing.html">it plans</a>
      <a href="ai-pricing.html">ai services</a>
      <button type="button" id="signOutBtn">sign out</button>
    </nav>
  </header>

  <main>
    <div id="loadingState">Loading your account...</div>

    <div id="accountContent" hidden>
      <section class="account-intro">
        <p class="intro">my account</p>
        <h1>Welcome back</h1>
        <p id="userEmail"></p>
      </section>

      <section class="panel">
        <h2>Subscription</h2>
        <div class="plan-status-row">
          <div>
            <p class="plan-name" id="planName">No active plan</p>
            <p class="plan-tagline" id="planTagline">You haven't activated an AI services plan yet.</p>
          </div>
          <span class="status-badge" id="statusBadge">Pending</span>
        </div>
        <div class="no-plan-cta" id="noPlanCta">
          <a class="btn btn-primary" href="ai-pricing.html">View AI plans</a>
          <a class="btn btn-secondary" href="mailto:info@skybridge-businesssolution.com?subject=Activate%20my%20subscription">Contact sales to activate</a>
        </div>
      </section>

      <section class="panel">
        <h2>Account details</h2>
        <ul class="detail-list">
          <li><span>Email</span><span id="detailEmail">—</span></li>
          <li><span>Member since</span><span id="detailCreated">—</span></li>
        </ul>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>Copyright 2026 | Sky Bridge Business Solution</p>
  </footer>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    const PLAN_LABELS = {
      'ai-starter': { name: 'AI Starter', tagline: 'Managed AI content writing for small teams publishing regularly.' },
      'ai-growth': { name: 'AI Growth', tagline: 'Content + voice AI with light automation for scaling teams.' },
      'ai-enterprise': { name: 'AI Enterprise', tagline: 'Custom AI integrated directly into your ERP, CRM, or website.' },
    };

    const loadingState = document.getElementById('loadingState');
    const accountContent = document.getElementById('accountContent');
    const userEmailEl = document.getElementById('userEmail');
    const detailEmailEl = document.getElementById('detailEmail');
    const detailCreatedEl = document.getElementById('detailCreated');
    const planNameEl = document.getElementById('planName');
    const planTaglineEl = document.getElementById('planTagline');
    const statusBadgeEl = document.getElementById('statusBadge');
    const noPlanCtaEl = document.getElementById('noPlanCta');
    const signOutBtn = document.getElementById('signOutBtn');

    function renderSubscription(data) {
      const plan = data.plan ? PLAN_LABELS[data.plan] : null;
      const status = data.status || 'pending';

      if (plan) {
        planNameEl.textContent = plan.name;
        planTaglineEl.textContent = plan.tagline;
        noPlanCtaEl.hidden = status === 'active';
      } else {
        planNameEl.textContent = 'No active plan';
        planTaglineEl.textContent = "You haven't activated an AI services plan yet.";
        noPlanCtaEl.hidden = false;
      }

      statusBadgeEl.textContent = status.charAt(0).toUpperCase() + status.slice(1);
      statusBadgeEl.className = 'status-badge status-' + status;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      userEmailEl.textContent = user.email;
      detailEmailEl.textContent = user.email;

      try {
        const snap = await getDoc(doc(db, 'customers', user.uid));
        const data = snap.exists() ? snap.data() : {};
        renderSubscription(data);
        if (data.createdAt && typeof data.createdAt.toDate === 'function') {
          detailCreatedEl.textContent = data.createdAt.toDate().toLocaleDateString();
        }
      } catch (err) {
        renderSubscription({});
      }

      loadingState.hidden = true;
      accountContent.hidden = false;
    });

    signOutBtn.addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
