<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to your Sky Bridge Business Solution account to view your AI services subscription.">
  <title>Sign In | Sky Bridge Business Solution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >
  <style>
    :root {
      --bg: #08111f;
      --panel: #0d1a2b;
      --panel-soft: #102138;
      --text: #d8e2ef;
      --heading: #eef6ff;
      --muted: #8ca0bb;
      --accent: #52e0c4;
      --accent-soft: rgba(82, 224, 196, 0.12);
      --line: rgba(140, 160, 187, 0.18);
      --danger: #f28b82;
      --success: #52e0c4;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.32);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    p { margin: 0; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 24px 0;
      align-items: center;
      justify-content: space-between;
      background: rgba(8, 17, 31, 0.86);
      backdrop-filter: blur(18px);
    }
    .logo {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 900;
    }
    .nav-links { display: flex; align-items: center; gap: clamp(14px, 2.4vw, 28px); font-weight: 800; text-transform: lowercase; }
    .nav-links a:hover { color: var(--accent); }

    main {
      width: min(460px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0 100px;
    }

    .auth-intro { text-align: center; margin-bottom: 32px; }
    .auth-intro .intro { color: var(--accent); font-weight: 800; text-transform: lowercase; letter-spacing: 0.02em; }
    .auth-intro h1 { font-size: clamp(1.6rem, 4vw, 2.1rem); color: var(--heading); margin: 12px 0 10px; font-weight: 900; }
    .auth-intro p { color: var(--muted); font-size: 0.96rem; }

    .auth-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 34px 30px;
      box-shadow: var(--shadow);
    }

    label { display: block; font-size: 0.86rem; font-weight: 700; color: var(--heading); margin-bottom: 8px; }
    .field { margin-bottom: 20px; }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--heading);
      font-family: inherit;
      font-size: 0.96rem;
    }
    input:focus { outline: none; border-color: var(--accent); }

    .field-footer { display: flex; justify-content: flex-end; margin-top: 8px; }
    .field-footer button {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }

    .submit-btn {
      width: 100%;
      padding: 13px 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: var(--bg);
      font-weight: 800;
      font-size: 0.96rem;
      cursor: pointer;
      margin-top: 6px;
    }
    .submit-btn:disabled { opacity: 0.6; cursor: default; }

    .form-error {
      background: rgba(242, 139, 130, 0.12);
      border: 1px solid rgba(242, 139, 130, 0.4);
      color: var(--danger);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 18px;
    }
    .form-notice {
      background: var(--accent-soft);
      border: 1px solid rgba(82, 224, 196, 0.4);
      color: var(--success);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 18px;
    }

    .switch-auth { text-align: center; margin-top: 22px; color: var(--muted); font-size: 0.9rem; }
    .switch-auth a { color: var(--accent); font-weight: 700; }

    .site-footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 40px 0; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html" aria-label="Sky Bridge Business Solution home">SB</a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="index.html">home</a>
      <a href="pricing.html">it plans</a>
      <a href="ai-pricing.html">ai services</a>
      <a href="signup.html" style="color:var(--accent)">sign up</a>
    </nav>
  </header>

  <main>
    <section class="auth-intro">
      <p class="intro">welcome back</p>
      <h1>Sign in to your account</h1>
      <p>View your Sky Bridge AI services subscription and plan details.</p>
    </section>

    <div class="auth-card">
      <p class="form-error" id="formError" hidden></p>
      <p class="form-notice" id="formNotice" hidden></p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <div class="field-footer">
            <button type="button" id="resetPasswordBtn">Forgot password?</button>
          </div>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">Sign in</button>
      </form>
      <p class="switch-auth">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <p>Copyright 2026 | Sky Bridge Business Solution</p>
  </footer>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('formError');
    const noticeEl = document.getElementById('formNotice');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetPasswordBtn');

    function showError(message) {
      noticeEl.hidden = true;
      errorEl.textContent = message;
      errorEl.hidden = false;
    }
    function showNotice(message) {
      errorEl.hidden = true;
      noticeEl.textContent = message;
      noticeEl.hidden = false;
    }

    function friendlyError(code) {
      switch (code) {
        case 'auth/invalid-email': return 'Enter a valid email address.';
        case 'auth/user-not-found':
        case 'auth/wrong-password':
        case 'auth/invalid-credential': return 'Incorrect email or password.';
        case 'auth/too-many-requests': return 'Too many attempts. Please wait and try again.';
        default: return 'Could not sign you in. Please try again.';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      noticeEl.hidden = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'account.html';
      } catch (err) {
        showError(friendlyError(err.code));
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });

    resetBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      if (!email) {
        showError('Enter your email above first, then click "Forgot password?".');
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        showNotice('Password reset email sent. Check your inbox.');
      } catch (err) {
        showError(friendlyError(err.code));
      }
    });
  </script>
</body>
</html>
