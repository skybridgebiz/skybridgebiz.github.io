<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create your Sky Bridge Business Solution account to manage your AI services subscription.">
  <title>Sign Up | Sky Bridge Business Solution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >
  <style>
    :root {
      --bg: #08111f;
      --panel: #0d1a2b;
      --panel-soft: #102138;
      --text: #d8e2ef;
      --heading: #eef6ff;
      --muted: #8ca0bb;
      --accent: #52e0c4;
      --accent-soft: rgba(82, 224, 196, 0.12);
      --line: rgba(140, 160, 187, 0.18);
      --danger: #f28b82;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.32);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    p { margin: 0; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 24px 0;
      align-items: center;
      justify-content: space-between;
      background: rgba(8, 17, 31, 0.86);
      backdrop-filter: blur(18px);
    }
    .logo {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 900;
    }
    .nav-links { display: flex; align-items: center; gap: clamp(14px, 2.4vw, 28px); font-weight: 800; text-transform: lowercase; }
    .nav-links a:hover { color: var(--accent); }

    main {
      width: min(460px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0 100px;
    }

    .auth-intro { text-align: center; margin-bottom: 32px; }
    .auth-intro .intro { color: var(--accent); font-weight: 800; text-transform: lowercase; letter-spacing: 0.02em; }
    .auth-intro h1 { font-size: clamp(1.6rem, 4vw, 2.1rem); color: var(--heading); margin: 12px 0 10px; font-weight: 900; }
    .auth-intro p { color: var(--muted); font-size: 0.96rem; }

    .auth-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 34px 30px;
      box-shadow: var(--shadow);
    }

    label { display: block; font-size: 0.86rem; font-weight: 700; color: var(--heading); margin-bottom: 8px; }
    .field { margin-bottom: 20px; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--heading);
      font-family: inherit;
      font-size: 0.96rem;
    }
    input:focus { outline: none; border-color: var(--accent); }

    .submit-btn {
      width: 100%;
      padding: 13px 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: var(--bg);
      font-weight: 800;
      font-size: 0.96rem;
      cursor: pointer;
      margin-top: 6px;
    }
    .submit-btn:disabled { opacity: 0.6; cursor: default; }

    .form-error {
      background: rgba(242, 139, 130, 0.12);
      border: 1px solid rgba(242, 139, 130, 0.4);
      color: var(--danger);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 18px;
    }

    .switch-auth { text-align: center; margin-top: 22px; color: var(--muted); font-size: 0.9rem; }
    .switch-auth a { color: var(--accent); font-weight: 700; }

    .site-footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 40px 0; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html" aria-label="Sky Bridge Business Solution home">SB</a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="index.html">home</a>
      <a href="pricing.html">it plans</a>
      <a href="ai-pricing.html">ai services</a>
      <a href="login.html" style="color:var(--accent)">sign in</a>
    </nav>
  </header>

  <main>
    <section class="auth-intro">
      <p class="intro">get started</p>
      <h1>Create your account</h1>
      <p>Sign up to manage your Sky Bridge AI services subscription.</p>
    </section>

    <div class="auth-card">
      <p class="form-error" id="formError" hidden></p>
      <form id="signupForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">Create account</button>
      </form>
      <p class="switch-auth">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <p>Copyright 2026 | Sky Bridge Business Solution</p>
  </footer>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    const form = document.getElementById('signupForm');
    const errorEl = document.getElementById('formError');
    const submitBtn = document.getElementById('submitBtn');

    function showError(message) {
      errorEl.textContent = message;
      errorEl.hidden = false;
    }

    function friendlyError(code) {
      switch (code) {
        case 'auth/email-already-in-use': return 'An account with that email already exists.';
        case 'auth/invalid-email': return 'Enter a valid email address.';
        case 'auth/weak-password': return 'Password must be at least 8 characters.';
        default: return 'Could not create your account. Please try again.';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showError('Passwords do not match.');
        return;
      }
      if (password.length < 8) {
        showError('Password must be at least 8 characters.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const credential = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, 'customers', credential.user.uid), {
          email,
          plan: null,
          status: 'pending',
          createdAt: serverTimestamp(),
        });
        window.location.href = 'account.html';
      } catch (err) {
        showError(friendlyError(err.code));
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
